<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ARMSTRONG - メイン画面</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="card main-card">
    <h2>ファイルの選択</h2>
    <p>処理したいkeylog2ファイルを選択してください。</p>
    <p class="privacy-note">ファイルはこのブラウザ内だけで処理され、外部には送信されません。</p>
    
    <div class="file-upload-area">
      <!-- keylog2ファイルのみを受け付けるように設定 -->
      <input type="file" id="fileInput" accept=".keylog2">
    </div>

    <!-- 現在の設定を表示（確認用） -->
    <div class="current-settings">
      <p>【現在適用中の設定】</p>
      <p>使用する手: <strong id="display-hands"></strong></p>
      <p>ホーム座標: <strong id="display-coords"></strong></p>
      <button id="changeSettingsBtn" class="btn-small">設定を変更する</button>
    </div>

    <div class="buttons">
      <button id="sendBtn" class="btn-success" disabled>解析する</button>
      <!-- 解析完了後に表示される次へ進むボタン -->
      <button id="nextPageBtn" class="btn-primary" style="display: none;">次へ進む →</button>
    </div>
  </div>

  <!-- カード外下のナビゲーションエリア（左右に配置） -->
<div class="main-nav">
    <a href="edit.html" class="btn-secondary btn-small">
        配列の編集
    </a>
    <button id="resetQwertyBtn" class="btn-secondary btn-small">
        初期配列(QWERTY)に戻す
    </button>
</div>
  
  <!-- スコア結果表示エリア（初期状態は非表示） -->
  <div id="score-result-area" class="score-container" style="display: none;">
    <div class="score-header">
      <h2>( ´∀｀ ) スコア計算結果</h2>
      <button id="copyTableBtn" class="btn-success btn-small">表データをコピー</button>
    </div>
    <p class="score-note">※物理的負担スコアが高い順</p>
    
    <div class="table-responsive">
      <table id="score-table" class="data-table">
        <thead id="score-thead"></thead>
        <tbody id="score-tbody">
          <!-- JSでここにデータが挿入されます -->
        </tbody>
      </table>
    </div>
  </div>
  <script src="common.js"></script>
  <script src="main.js"></script>
</body>
</html>
