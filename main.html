<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ARMSTRONG - メイン画面</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="card main-card">
    <h2>ファイルのアップロード</h2>
    <p>処理したいテキストファイルを選択してください。</p>
    
    <div class="file-upload-area">
      <!-- .txt などのテキスト系ファイルのみを受け付けるように設定 -->
      <input type="file" id="fileInput" accept=".txt, .csv, .json, text/plain">
    </div>

    <!-- 現在の設定を表示（確認用） -->
    <div class="current-settings">
      <p>【現在適用中の設定】</p>
      <p>使用する手: <strong id="display-hands"></strong></p>
      <p>ホーム座標: <strong id="display-coords"></strong></p>
      <button id="changeSettingsBtn" class="btn-small">設定を変更する</button>
    </div>

    <div class="buttons">
      <button id="sendBtn" class="btn-success" disabled>送信する</button>
    </div>
  </div>

  <script src="main.js"></script>
</body>
</html>
