<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>過去の配列履歴</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="history-page">
  <h2>🕒 過去のキーボード配列履歴</h2>
  <p>過去に保存されたカスタマイズ配列の一覧です。（標準のQWERTY配列は除外されています）</p>

  <!-- 名前の一覧部分だけを包むカード -->
  <div class="history-card">
    <div class="history-list" id="historyList">
      <!-- JavaScriptでここに履歴アイテムが挿入されます -->
    </div>
  </div>

  <!-- プレビューエリア（変更なし） -->
  <div id="preview-area" class="preview-area">
    <div class="history-preview-container">
      <div class="preview-box">
        <h3 id="preview-title" style="margin-top: 0; text-align: center; color: #4CAF50;"></h3>
        <div id="keyboard-preview" class="history-keyboard"></div>
      </div>
      
      <div class="preview-box">
        <h3 style="margin-top: 0; text-align: center; color: #555;">現在の配列</h3>
        <div id="current-keyboard-preview" class="history-keyboard"></div>
      </div>
    </div>
    
    <div style="text-align: center; margin-top: 35px;">
      <button id="applyBtn" class="btn-primary">✅ この過去の配列を適応する</button>
    </div>
  </div>

  <div style="text-align: left; margin-bottom: 40px;">
    <button id="backBtn" class="btn-secondary">編集画面に戻る</button>
  </div>

  </main>

  <script src="common.js"></script>
  <script src="history.js"></script>
</body>
</html>
