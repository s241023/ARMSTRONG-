<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ARMSTRONG - キー入れ替え提案</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- 🟢 カード枠を廃止し幅を広く使ったラッパー -->
  <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
    <h2 style="margin: 0;">⌨️ 入れ替え後キー配置プレビュー</h2>
    <div style="display: flex; gap: 10px; margin: 0% 10px">
      <button id="saveConfigBtn" class="btn-success btn-small">ブラウザに保存</button>
      <button id="backBtn" class="btn-small">← メインに戻る</button>
    </div>
  </div>
    
    <!-- ユーザー設定の確認表示 -->
    <div class="current-settings" style="margin-bottom: 15px;">
      <p style="margin: 0;">使用する手: <strong id="user-hands">-</strong> / ホーム座標数: <strong id="user-coords-count">-</strong></p>
    </div>

    <!-- プレビュー表示エリア -->
    <div class="preview-container">
      <div id="keyboard-preview" class="preview-keyboard">
        <!-- JSでキーボードが描画されます -->
      </div>

      <!-- シンプルな凡例 -->
      <div class="preview-legend">
        <div class="legend-box"></div>
        <span>入れ替えられたキー</span>
      </div>
    </div>
  </div>

  <!-- 🟢 隠しコマンド（score）で表示される詳細テーブルエリア -->
  <div id="suggestion-area" class="card result-card" style="display: none; margin-top: 30px;">
    <h3>📊 詳細データ・提案リスト</h3>
    <div style="text-align: left; margin-top: 10px; font-size: 0.85em; color: #555;">
      <p style="margin: 3px 0;"><strong>【改善対象】</strong> 負担スコア $\ge 0.75$ かつ 使用頻度 $> 0\%$（使用頻度順）</p>
      <p style="margin: 3px 0;"><strong>【交換条件】</strong> 対象キーより負担・頻度ともに低く、総合的に最も数値が小さいキーと交換</p>
    </div>

    <div class="table-responsive" style="margin-top: 15px;">
      <table id="suggestion-table">
        <thead>
          <tr>
            <th>順位</th>
            <th>改善キー</th>
            <th>対象頻度</th>
            <th>対象負担</th>
            <th>推奨交換先キー</th>
            <th>交換先負担</th>
            <th>交換先頻度</th>
          </tr>
        </thead>
        <tbody id="suggestion-tbody">
          <!-- JSで動的生成 -->
        </tbody>
      </table>
    </div>
  </div>

  <script src="result.js"></script>
</body>
</html>
